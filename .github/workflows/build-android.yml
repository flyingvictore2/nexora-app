name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Capacitor Android files
        working-directory: frontend
        run: mkdir -p out && npx cap sync android

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release/nexora.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-apk
          path: release/nexora.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/nexora.apk
          name: Nexora ${{ github.ref_name }}
          body: |
            ## Nexora para Android ${{ github.ref_name }}
            ### Instalación
            1. Descarga `nexora.apk`
            2. En Android: **Ajustes → Seguridad → Instalar apps desconocidas** → actívalo
            3. Abre el APK e instala
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
