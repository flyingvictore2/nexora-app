<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Nexora — Sin conexión</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      -webkit-app-region: drag;
    }
    .logo { font-size: 36px; font-weight: 900; letter-spacing: 8px; color: #e50914; }
    .icon { font-size: 48px; opacity: 0.4; margin-bottom: 8px; }
    h2 { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.8); }
    p  { font-size: 13px; color: rgba(255,255,255,0.4); text-align: center; max-width: 340px; line-height: 1.6; }
    button {
      margin-top: 8px;
      -webkit-app-region: no-drag;
      background: #e50914;
      color: #fff;
      border: none;
      padding: 10px 28px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c4000f; }
  </style>
</head>
<body>
  <div class="logo">NEXORA</div>
  <div class="icon">📡</div>
  <h2>Sin conexión a Internet</h2>
  <p>No se puede conectar al servidor. Comprueba tu conexión e inténtalo de nuevo.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
